name: Build

on:
  push:
  pull_request:

jobs:
  Linux:
    runs-on: ubuntu-latest

    steps:
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget cmake g++ libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev libjsoncpp-dev libfuse2
      - name: checkout
        uses: actions/checkout@v4
      - name: build
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr .
          make
          strip --strip-unneeded freegemas
          make install DESTDIR=AppDir
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage
      - name: publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: freegemas-linux
          path: |
            Freegemas*.AppImage
            LICENSE
            README.md

  Windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-SDL2_mixer
            mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-jsoncpp
          update: true
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -G "MinGW Makefiles" .
          cmake --build .
          strip --strip-unneeded freegemas.exe
      - name: Publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: freegemas-windows
          path: |
            freegemas.exe
            media
            LICENSE
            README.md

  MacOS:
    runs-on: macos-15

    env:
      # Homebrew bottles are single-arch, so a universal bundle has to link
      # against universal dependencies built from source by vcpkg. They are
      # installed into the workspace rather than a system prefix so the whole
      # dependency set can be cached and thrown away with the job.
      VCPKG_INSTALLED: ${{ github.workspace }}/vcpkg-deps
      VCPKG_CACHE_DIR: ${{ github.workspace }}/vcpkg-cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install pkg-config
        run: brew install pkg-config

      - name: bootstrap vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      - name: restore dependency build cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_CACHE_DIR }}
          key: vcpkg-${{ runner.os }}-universal-${{ hashFiles('platform/macos/triplets/universal-osx.cmake') }}

      - name: install universal dependencies
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --triplet universal-osx \
            --overlay-triplets "$GITHUB_WORKSPACE/platform/macos/triplets" \
            --x-install-root "$VCPKG_INSTALLED" \
            --clean-after-build \
            sdl2 sdl2-image sdl2-mixer sdl2-ttf jsoncpp
      - name: build
        run: |
          # CMakeLists.txt discovers everything through pkg-config, and the
          # vcpkg-installed .pc files carry the (relocated) install prefix.
          export PKG_CONFIG_PATH="$VCPKG_INSTALLED/universal-osx/lib/pkgconfig"
          export CMAKE_PREFIX_PATH="$VCPKG_INSTALLED/universal-osx"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/dist" \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build --parallel
          strip build/freegemas.app/Contents/MacOS/freegemas
          cmake --install build
      - name: verify universal
        run: |
          # Fail here rather than shipping a single-arch app plus bundle.
          BIN=dist/freegemas.app/Contents/MacOS/freegemas
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q x86_64
          lipo -info "$BIN" | grep -q arm64
          status=0
          for lib in dist/freegemas.app/Contents/Frameworks/*.dylib; do
            lipo -info "$lib"
            lipo -info "$lib" | grep -q x86_64 || { echo "::error::$lib is missing x86_64"; status=1; }
            lipo -info "$lib" | grep -q arm64 || { echo "::error::$lib is missing arm64"; status=1; }
          done
          exit $status
      - name: package
        run: |
          # upload-artifact uses the least common ancestor of the listed paths as
          # the artifact root. Uploading dist/freegemas.app alongside LICENSE and
          # README.md therefore makes the workspace the root and leaves a stray
          # dist/ wrapper in every download. Staging the files side by side keeps
          # the extracted archive flat: freegemas.app, LICENSE, README.md.
          mkdir -p macos
          cp -R dist/freegemas.app macos/
          cp LICENSE README.md macos/
      - name: publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: freegemas-macos-universal
          path: macos/
          if-no-files-found: error

  Vita:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="${VITASDK}/share/vita.toolchain.cmake" .
          make
      - name: Publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: freegemas-vita
          path: |
            freegemas.vpk
            LICENSE
            README.md

  Release:
    # `always()` makes the release ignore the outcome of the build jobs: it
    # publishes whatever artifacts exist instead of failing because one platform
    # (typically Vita or Windows on a fork) is broken. It is still kept in
    # `needs:` so it *waits* for the builds; removing `needs:` would let it start
    # concurrently with them and race the artifact uploads, producing an empty
    # release.
    needs: [Linux, Windows, Vita, MacOS]
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build: [linux, windows, vita, macos]
      # One platform having no artifact must not stop the others publishing.
      fail-fast: false
    steps:
    - name: Extract tag name
      id: tag
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Zip artifacts
      run: |
        set -euo pipefail
        cd artifacts
        if [ "${{ matrix.build }}" = "macos" ]; then
          # The macOS artifact is the universal bundle now, but older runs may
          # still carry per-arch names, so match the prefix.
          shopt -s nullglob
          zips=()
          for artifact in freegemas-macos-*; do
            [ -d "$artifact" ] || continue
            zip -r "${artifact}.zip" "$artifact"
            zips+=("${artifact}.zip")
          done
          if [ ${#zips[@]} -eq 0 ]; then
            echo "::warning::no freegemas-macos-* artifact, nothing to release"
            exit 0
          fi
        else
          if [ ! -d "freegemas-${{ matrix.build }}" ]; then
            echo "::warning::no freegemas-${{ matrix.build }} artifact, nothing to release"
            exit 0
          fi
          zip -r "freegemas-${{ matrix.build }}.zip" "freegemas-${{ matrix.build }}"
        fi
    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/freegemas-${{ matrix.build }}*.zip
        tag_name: ${{ steps.tag.outputs.VERSION }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
